schema: spec-driven

# MUST stay in sync with openspec/project.md — see "Contexto do projeto" rules in CLAUDE.md.
context: |
  Full project context: openspec/project.md (read it before writing proposals/designs/tasks).
  Problem: Itaú technical challenge on the itau-code-challange-starter-kit template (branch `kotlin`).
  Consume Kafka topic `transacoes-financeiras-processadas` (Redpanda), persist in DynamoDB the LATEST balance
  snapshot per account, expose `GET /balances/{accountId}` returning that snapshot.
  Requirements source of truth: `.challenge/enunciado.md` (full transcription of the challenge PDF; local, NOT
  versioned, `.challenge/` is gitignored and must never be committed); it prevails over this context.
  Delivery: 3 days, public GitHub repository.
  Domain premise: each event is a CREDIT/DEBIT transaction already processed by the authorizer (APPROVED or
  DECLINED) and EVERY event carries the account balance ALREADY CALCULATED. The service NEVER recalculates
  balance; it keeps the most recent snapshot per account.id, where "most recent" = transaction.timestamp
  (epoch MICROseconds), not arrival order.
  Event: {"transaction":{"id","type":CREDIT|DEBIT,"amount","currency":"BRL","status":APPROVED|DECLINED,
  "timestamp":<µs>},"account":{"id","owner","created_at":<µs>,"status","balance":{"amount","currency":"BRL"}}}
  (same shape as `make kafka-produce-transactions-events`; amounts have 2 decimals; generator uses random
  account ids per event; topic must be created explicitly; partition count is our choice).
  API: `accountId` path param is a UUID. Response fields (exact snake_case): {"id":<account uuid>,
  "owner":<uuid>,"balance":{"amount":Number,"currency":ISO 4217},"updated_at":ISO 8601 string, e.g.
  "2025-07-05T18:04:13.433-03:00"}.
  Open ambiguities (decide and justify in the change's design.md, never assume): whether DECLINED events update
  the snapshot; HTTP status for unknown account and for non-UUID accountId.
  Decided ambiguities (add-balance-repository): `updated_at` = transaction.timestamp of the event that produced
  the snapshot; "most recent" is defined only by domain `SnapshotVersion` (greater timestamp, tie broken by the
  greater transaction id as lowercase text, not UUID.compareTo); the DynamoDB adapter applies it as a
  ConditionExpression.
  NFRs: mission-critical, 24/7, high volume. Must stay correct under: duplicates (idempotent); out-of-order
  events (older never overwrites newer, also with concurrent consumers); invalid data (must not block
  consumption nor corrupt snapshots; isolated and observable; invalid request such as non-UUID accountId gets
  an explicit error response); unknown account (explicit error response, never 500); unavailable
  dependencies (DynamoDB/broker: retry, backoff, circuit breaker, no silent event loss); high volume
  (key-based reads/writes, no Scan, horizontally scalable consumption).
  Evaluation (challenge list): DynamoDB data modeling (partition key, sort key, secondary indexes);
  concurrency (balance reflects the most recent transaction even with out-of-order messages); resilience
  (retries, backoff, circuit breaker where appropriate); tests of main flows and corner cases (duplicates,
  out-of-order, unknown account); code quality (organization, readability, adherence to the starter-kit
  hexagonal architecture); adverse/edge scenarios in the API; production readiness (logging, metrics,
  containerization); any pattern/algorithm not implemented must be DOCUMENTED with what could be done and why.
  Working rules (MANDATORY): TDD — every spec `#### Scenario` becomes a test BEFORE production code;
  money is BigDecimal end to end (never Double/Float); domain has no framework dependency (no Spring,
  AWS SDK, Kafka, Jackson); ONE commit per OpenSpec change (Conventional Commits); CONTRACTS come from
  `.challenge/enunciado.md` (topic payload, request, response): every change touching a contract must check
  field names, types and formats there (snake_case, µs, ISO 8601, UUID) and never invent, rename or "improve"
  a field; anything the statement leaves undefined becomes an explicit decision in the change's design.md.
  CODE QUALITY CONSTITUTION (NON-NEGOTIABLE, full text in CLAUDE.md; applies to test code too): Clean
  Architecture (dependencies point inward, business rules and invariants live in domain value objects/entities
  validated at construction, application only orchestrates, adapters only translate, no technology type crosses
  a port); SOLID; Clean Code (intention-revealing domain names, small single-purpose functions, <= 3 params, no
  boolean flag params, value objects instead of primitives, immutability, no swallowed exceptions, no `!!`,
  exhaustive `when` on sealed types, no magic values/dead/commented-out code); DRY (of knowledge, rule of
  three), KISS, YAGNI (only what the spec asks; leftovers are documented); tests follow F.I.R.S.T., one behavior
  each, AAA; comments live ONLY in a file header, ONE `/* ... */` block before `package` (in a shell script, `#`
  lines right after the shebang), in pt-BR (Brazilian Portuguese), with no comment in the body; the header holds
  one entry per created or altered piece, as `L<start>[-L<end>] <symbol>: <why>` with a real WHY (for a simple
  type, why it exists as a distinct type), and on the last line `Enunciado: <section> → <item>`; an entry whose
  item differs from the main one carries its own `Enunciado:` at its end; line numbers are those of the final
  file, counting the header, and change along with the file; a type or class entry cites only its declaration
  line, and a function or piece entry cites the range up to the line that closes it (`)` or `}`, when there is
  one); and the symbol helps to find the piece again when lines shift; a trivial file (only getters, delegations
  or single expressions without a rule) needs no header; the only exception to "nothing in the body" is contract
  KDoc (return and exceptions) on port and public domain API signatures, which the port's header points to; the
  item is the sub-section title or the bold bullet text of enunciado.md, without emoji, and may cite a contract
  field; no matching item: `Enunciado: n/a (<change> design Dn)`, never invent one; design references are always
  `<change> design Dn`; a test file header also carries `Spec: <requirement>` (several separated by `;`, or
  `Spec: n/a (<change> design Dn)`) before the `Enunciado:` line, and only the class and non-obvious points
  enter it, since test names already describe the behavior; also allowed in the header: external references and
  a unit/format the type does not express; technical terms and identifiers stay as in the code; a stale comment
  is a bug; forbidden: comments that restate the code, noise comments, journal/authorship, commented-out code,
  banners and TODO/FIXME in delivered code; the user reviews comments manually before each commit; LOW COGNITIVE
  LOAD and COHERENCE (prefer the solution a human understands fastest; one name per concept; read existing code
  first and follow its naming/file/package/test patterns; if an existing pattern violates an article the article
  wins and the divergence is explicit; a reviewer cites the concrete snippet, not an abstract criterion);
  DESIGN PATTERNS (check whether a recognized pattern fits before designing, never force one, KISS/YAGNI win);
  DON'T REINVENT THE WHEEL (Kotlin/JDK stdlib, then Spring incl. its ecosystem projects, then AWS SDK, then a
  well-known maintained Kotlin/Spring library, before custom code; custom code is for domain rules or when no
  adequate alternative exists; Art. 1 still wins over any library). Arts. 8-10 also apply to change artifacts
  and build dependencies. design.md records the pattern (or why none fits), the rejected library alternative,
  each codebase-pattern divergence and, for a new dependency, version, last release date and cost vs building it
  (a new dependency must be actively maintained, mature and widely adopted); the project context records only
  the dependency and why; without a design.md (code change outside an OpenSpec change) the record goes in the
  commit description and review report. Violating it requires asking the user first.
  INDEPENDENT AGENT REVIEW (MANDATORY, procedure in CLAUDE.md): before committing any change, with
  `./gradlew check` green, a fresh-context read-only subagent (never a fork) reviews the diff against the change artifacts,
  the constitution (incl. that every altered file has the pt-BR header with entries whose lines and symbols match
  the file, the WHY and a real enunciado item, with no body comments except contract KDoc, noise or restated
  code), the
  enunciado contracts and the working rules; findings are blocker/ adjustment/suggestion with file:line; iterate
  until no blocker/adjustment remains, max 3 rounds, then escalate to the user; if the plan itself is wrong,
  propose fixing the artifact instead of deviating.
  Stack: Kotlin 2.3.21, Java 21, Spring Boot 4.1 (WebMVC + Spring Kafka), Gradle 9.5 Kotlin DSL,
  Jackson 3 (tools.jackson — never com.fasterxml), AWS SDK v2 DynamoDB, with apache5-client declared for the
  connection/socket timeouts (DynamoDB Local :8000),
  Kafka via Redpanda (localhost:19092, topic auto-creation DISABLED), Docker Compose.
  Architecture: hexagonal per bounded context under br.com.itau.challenge.<ctx>/
  {domain/{model,exception}, port/{input,output}, application, adapter/{input/{web,kafka},output/dynamodb}}.
  domain has no Spring; ports are `fun interface`; services are @Service implementing input ports;
  adapters convert DTOs to domain; application never imports adapter. HexagonalArchitectureTest (Konsist, root
  package) enforces this: the layer rule matches `..domain..`/`..port..`/... across all contexts at once; the
  tests forbidding framework imports in domain and ports are parameterized per context — new contexts must be
  added to the test's context list.
  Conventions: code in English (identifiers, exception messages, test names), comments and docs in Portuguese;
  constructor injection; config via ${ENV:default} in application.yaml + docker-compose env; single config value
  via constructor @Value, a group that would exceed 3 params via an immutable @ConfigurationProperties data
  class; pinned Docker image versions.
  DynamoDB tables (created idempotently by infra/dynamodb/seed.sh): GreetingMessages (GREETING_TABLE_NAME) and
  AccountBalances (BALANCE_TABLE_NAME). The kit's DynamoDbClient (DynamoDbConfig + DynamoDbProperties) is the
  only client and must be reused; explicit timeouts/retries via DYNAMODB_CONNECTION_TIMEOUT (500ms),
  DYNAMODB_SOCKET_TIMEOUT (1s), DYNAMODB_API_CALL_ATTEMPT_TIMEOUT (1s), DYNAMODB_API_CALL_TIMEOUT (3s),
  DYNAMODB_MAX_ATTEMPTS (3).
  Tests: unit in src/test/kotlin (mirrors main packages, no infra, lambda fakes for ports, Mockito for AWS client,
  MockMvc for web) via `./gradlew check` with JaCoCo gate >= 90% instructions; integration in
  src/integrationTest/kotlin against real DynamoDB Local + Redpanda via `./gradlew integrationTest`.
  Main flows AND corner cases (duplicate, out-of-order, unknown account, invalid data, dependency down) must be
  tested.
  Test names: backtick `should ... when ...`, AAA layout, kotlin.test asserts.
  Git: main branch `kotlin`; Conventional Commits 1.0.0 `<type>(<scope>)!: <description>` (types feat/fix/refactor/
  perf/test/docs/build/ci/chore/style/revert; scope = bounded context or area; type/scope in English, description,
  body and footer in PORTUGUESE, imperative, lowercase, no period, header <= 72 chars); one commit per OpenSpec
  change, containing code, tests, specs and the context updates it motivated.
  Makefile: up/run/stop/logs/build/http; db-up/db-seed/db-scan/db-down; kafka-up/kafka-seed/
  kafka-topic-create NAME=/kafka-produce-{accounts,transactions}-events TOPIC= COUNT=/kafka-consume TOPIC=/kafka-down;
  test (check inside docker build); integration-test (host JDK); clean-containers; clean.
  Template gaps the challenge must address: no @RestControllerAdvice (domain exceptions -> 500), no Kafka
  DLT/error handler, app in compose does not wait for seeds, example adapter uses Scan per request.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules — enforce the CLAUDE.md constitution and independent review in every change.
rules:
  design:
    - State how the change respects the CLAUDE.md constitution (layers touched, ports, value objects).
    - Resolve every ambiguity of `.challenge/enunciado.md` the change touches as an explicit decision with rationale.
    - Name the design pattern applied (or why none fits) and the library/stdlib alternatives considered for
      anything that is not domain logic.
    - State which existing codebase patterns (naming, files, packages) the change follows and justify every
      divergence.
  tasks:
    - Order tasks test-first (TDD) — each spec scenario gets a failing-test task before its implementation task.
    - End with a task "Independent agent review" following the CLAUDE.md procedure (max 3 rounds), then a
      task to update openspec/project.md and config.yaml context if the change justifies it (CLAUDE.md Rule 3).
