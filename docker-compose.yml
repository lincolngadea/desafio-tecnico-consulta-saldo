# L12-L16 app: porta de gerenciamento separada e orçamento de memória tornam probes e limites operacionais explícitos.
# L32-L34 app.environment: credenciais fictícias servem apenas ao DynamoDB Local; gerenciamento segue a porta publicada.
# L52-L70 app: seeds completos evitam corrida na subida; readiness sinaliza quando o serviço pode receber tráfego.
# L133 redpanda-seed: o mesmo script idempotente usado pelo make cria os tópicos antes de iniciar a aplicação.
# Enunciado: O que será avaliado → Production readiness

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
      - "8082:8082"
    stop_grace_period: 40s
    mem_limit: 768m
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-east-1
      GREETING_TABLE_NAME: GreetingMessages
      BALANCE_TABLE_NAME: AccountBalances
      DYNAMODB_CONNECTION_TIMEOUT: 500ms
      DYNAMODB_SOCKET_TIMEOUT: 1s
      DYNAMODB_API_CALL_ATTEMPT_TIMEOUT: 1s
      DYNAMODB_API_CALL_TIMEOUT: 3s
      DYNAMODB_MAX_ATTEMPTS: 3
      DYNAMODB_READ_CONNECTION_TIMEOUT: 200ms
      DYNAMODB_READ_SOCKET_TIMEOUT: 300ms
      DYNAMODB_READ_API_CALL_ATTEMPT_TIMEOUT: 300ms
      DYNAMODB_READ_API_CALL_TIMEOUT: 800ms
      DYNAMODB_READ_MAX_ATTEMPTS: 2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      MANAGEMENT_PORT: 8082
      BALANCE_API_RETRY_AFTER: 5s
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      GREETING_TEMPLATES_TOPIC: greeting-templates
      TRANSACTIONS_TOPIC: transacoes-financeiras-processadas
      TRANSACTIONS_DLT_TOPIC: transacoes-financeiras-processadas.DLT
      TRANSACTIONS_CONSUMER_GROUP_ID: balance-transaction-ingestion
      INGESTION_CONCURRENCY: 1
      INGESTION_MAX_RETRIES: 3
      INGESTION_BACKOFF_INITIAL: 200ms
      INGESTION_BACKOFF_MULTIPLIER: 2.0
      INGESTION_BACKOFF_MAX: 2s
      INGESTION_BACKOFF_JITTER: 100ms
      INGESTION_PAUSE_DURATION: 30s
      BALANCE_CB_FAILURE_RATE_THRESHOLD: 50
      BALANCE_CB_SLIDING_WINDOW_SIZE: 10
      BALANCE_CB_WAIT_DURATION_OPEN: 30s
      BALANCE_CB_HALF_OPEN_CALLS: 3
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-seed:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
      redpanda-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8082 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && grep -q "status.:.UP" <&3'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"

  dynamodb-seed:
    image: amazon/aws-cli:2.36.8
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      GREETING_TABLE_NAME: GreetingMessages
      BALANCE_TABLE_NAME: AccountBalances
    volumes:
      - ./infra/dynamodb:/dynamodb-seed:ro
    entrypoint: ["/bin/bash", "/dynamodb-seed/seed.sh"]

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    depends_on:
      - dynamodb
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    hostname: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"

  redpanda-seed:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      - redpanda
    environment:
      REDPANDA_BROKERS: redpanda:9092
      GREETING_TEMPLATES_TOPIC: greeting-templates
    volumes:
      - ./infra/redpanda:/redpanda-seed:ro
    entrypoint: ["/bin/bash", "-c", "/redpanda-seed/config.sh && /redpanda-seed/seed.sh && /redpanda-seed/ingestion-topics.sh"]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8081:8080"
