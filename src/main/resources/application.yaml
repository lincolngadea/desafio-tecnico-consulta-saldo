spring:
  application:
    name: itau-code-challange-starter-kit
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:hello-greeting-template-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  table-name: ${GREETING_TABLE_NAME:GreetingMessages}
  balance-table-name: ${BALANCE_TABLE_NAME:AccountBalances}
  timeouts:
    connection: ${DYNAMODB_CONNECTION_TIMEOUT:500ms}
    socket: ${DYNAMODB_SOCKET_TIMEOUT:1s}
    api-call-attempt: ${DYNAMODB_API_CALL_ATTEMPT_TIMEOUT:1s}
    api-call: ${DYNAMODB_API_CALL_TIMEOUT:3s}
  retry:
    max-attempts: ${DYNAMODB_MAX_ATTEMPTS:3}

greeting-templates:
  topic-name: ${GREETING_TEMPLATES_TOPIC:greeting-templates}

ingestion:
  topic-name: ${TRANSACTIONS_TOPIC:transacoes-financeiras-processadas}
  dlt-topic-name: ${TRANSACTIONS_DLT_TOPIC:transacoes-financeiras-processadas.DLT}
  consumer-group-id: ${TRANSACTIONS_CONSUMER_GROUP_ID:balance-transaction-ingestion}
  concurrency: ${INGESTION_CONCURRENCY:1}
  max-retries: ${INGESTION_MAX_RETRIES:3}
  backoff:
    initial: ${INGESTION_BACKOFF_INITIAL:200ms}
    multiplier: ${INGESTION_BACKOFF_MULTIPLIER:2.0}
    max: ${INGESTION_BACKOFF_MAX:2s}
    jitter: ${INGESTION_BACKOFF_JITTER:100ms}
  pause-duration: ${INGESTION_PAUSE_DURATION:30s}

balance:
  circuit-breaker:
    failure-rate-threshold: ${BALANCE_CB_FAILURE_RATE_THRESHOLD:50}
    sliding-window-size: ${BALANCE_CB_SLIDING_WINDOW_SIZE:10}
    wait-duration-in-open-state: ${BALANCE_CB_WAIT_DURATION_OPEN:30s}
    half-open-calls: ${BALANCE_CB_HALF_OPEN_CALLS:3}
