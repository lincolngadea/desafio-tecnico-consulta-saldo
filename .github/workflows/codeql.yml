# L34 analyze.timeout-minutes: um novo travamento falha em minutos, e não após as 6 h padrão da plataforma
#     (fix-codeql-build design D4).
# L45-L49 Initialize CodeQL: Kotlin exige build, e o autobuild não aceita parâmetros; o build manual torna
#     explícito e testável o comando que o extrator rastreia.
# L51-L55 Compile all source sets: o extrator Kotlin é single-threaded e travou o compileKotlin por horas;
#     em processo e com um worker a compilação termina, e o heap de 4 GiB comporta compilador e extrator, que
#     esgotaram os 512 MiB padrão. Sem setup-gradle, porque uma task restaurada do cache não compila e não seria
#     extraída (fix-codeql-build design D2, D3, D5).
# Enunciado: n/a (fix-codeql-build design D1)

name: CodeQL

on:
  push:
    branches: [main, kotlin]
  pull_request:
    branches: [main, kotlin]
  schedule:
    - cron: "30 1 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile all source sets
        run: >-
          ./gradlew testClasses integrationTestClasses --no-daemon
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=1
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
